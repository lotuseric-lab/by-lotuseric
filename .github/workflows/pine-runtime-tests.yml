name: Pine runtime foundation tests

on:
  push:
    branches:
      - feature/pine-engine-evaluator
      - feature/pine-force-overlay-routing
    paths:
      - "pine/**"
      - "index.html"
      - ".github/workflows/pine-runtime-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pine/**"
      - "index.html"
      - ".github/workflows/pine-runtime-tests.yml"

permissions:
  contents: read

jobs:
  pine-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pine/pine-frontend.test.js
      - run: node pine/pine-parser.test.js
      - run: node pine/pine-runtime.test.js
      - run: node pine/pine-interpreter.test.js
      - run: node pine/pine-function-series-history.test.js
      - run: node pine/pine-security-tuple-history.test.js
      - run: node pine/pine-security-lower-tf.test.js
      - run: node pine/pine-ta-history-functions.test.js
      - run: node pine/pine-dmi-performance.test.js
      - run: node pine/pine-table-merge.test.js
      - run: node pine/pine-table-api.test.js
      - run: node pine/pine-drawing-mutation.test.js
      - run: node pine/pine-strategy-basic.test.js
      - run: node pine/pine-strategy-exit.test.js
      - run: node pine/pine-strategy-partial-trailing.test.js
      - run: node pine/pine-strategy-trade-history.test.js
      - run: node pine/pine-force-overlay.test.js
      - run: node pine/pine-chart-adapter.test.js
      - run: node pine/pine-drawing-pane.test.js
      - run: node pine/pine-fill-redraw.test.js
      - run: node pine/pine-app-integration.test.js
      - run: node pine/pine-fixture-parse.test.js
      - run: node pine/check-inline-scripts.js
# Strategy exit regression coverage refreshed
# Strategy performance summary coverage refreshed
# Empty-history strategy safety regression refreshed
# Guard empty-bar performance summary regression
