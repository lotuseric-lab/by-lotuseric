name: Pine runtime foundation tests

on:
  push:
    branches:
      - feature/pine-compatible-runtime
    paths:
      - "pine/**"
      - "index.html"
      - ".github/workflows/pine-runtime-tests.yml"
  pull_request:
    paths:
      - "pine/**"
      - ".github/workflows/pine-runtime-tests.yml"

permissions:
  contents: read

jobs:
  pine-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pine/pine-frontend.test.js
      - run: node pine/pine-parser.test.js
      - run: node pine/pine-runtime.test.js
      - run: node pine/check-inline-scripts.js
