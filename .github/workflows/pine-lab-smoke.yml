name: Pine Engine Lab Smoke Test

on:
  push:
    branches:
      - experiment/piner-engine-evaluation
    paths:
      - "pine-lab/**"
      - "pine/**"
      - ".github/workflows/pine-lab-smoke.yml"
  pull_request:
    paths:
      - "pine-lab/**"
      - "pine/**"
      - ".github/workflows/pine-lab-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pine-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run smoke
      - run: npm run test:v14
      - name: Test BY LOTUSERIC own Pine runtime
        run: node own-engine-regression.mjs
      - name: Attempt full V14 on BY LOTUSERIC own runtime
        run: npm run test:own-v14
