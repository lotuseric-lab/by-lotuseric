name: Pine Engine Lab Smoke Test

on:
  push:
    branches:
      - experiment/piner-engine-evaluation
    paths:
      - "pine-lab/**"
      - ".github/workflows/pine-lab-smoke.yml"
  pull_request:
    paths:
      - "pine-lab/**"
      - ".github/workflows/pine-lab-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pine-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pine-lab/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run smoke
