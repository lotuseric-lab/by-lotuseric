name: Smart Grid AI tests

on:
  push:
    paths:
      - "spot-grid-ai/**"
      - ".github/workflows/spot-grid-ai-tests.yml"
  pull_request:
    paths:
      - "spot-grid-ai/**"
      - ".github/workflows/spot-grid-ai-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spot-grid-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spot-grid-ai/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest test_engine -v
