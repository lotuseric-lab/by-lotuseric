name: Deploy By LOTUSERIC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and vendor Lightweight Charts
        run: |
          mkdir -p vendor /tmp/lwc
          npm pack lightweight-charts@5.0.8 --pack-destination /tmp/lwc
          tar -xzf /tmp/lwc/lightweight-charts-5.0.8.tgz -C /tmp/lwc
          test -s /tmp/lwc/package/dist/lightweight-charts.standalone.production.js
          cp /tmp/lwc/package/dist/lightweight-charts.standalone.production.js vendor/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
